pluginManagement {
    repositories {
        exclusiveContent {
            forRepository { maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' } }
            filter { includeGroupAndSubgroups 'net.fabricmc' }
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'tukuai'
include 'engine'

// A Fabric and a NeoForge project for each Minecraft version, in versions/<minecraft>/<loader>,
// named like :fabric-26.1.2. The newest version comes first.
for (minecraft in ['26.1.2', '1.21.1']) {
    for (loader in ['fabric', 'neoforge']) {
        include ":${loader}-${minecraft}"
        project(":${loader}-${minecraft}").projectDir = file("versions/${minecraft}/${loader}")
    }
}
