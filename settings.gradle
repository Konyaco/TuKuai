pluginManagement {
    repositories {
        exclusiveContent {
            forRepository { maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' } }
            filter { includeGroupAndSubgroups 'net.fabricmc' }
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'tukuai'
include 'engine', 'fabric', 'neoforge'
