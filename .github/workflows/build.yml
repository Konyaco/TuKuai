name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read versions
        id: versions
        run: echo "version=$(sed -n 's/^mod_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"

      - name: Check language files
        run: .github/scripts/check-lang.py

      # Gradle runs on the newest Java; the 1.21.1 projects build with Java 21 from a toolchain.
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: tukuai-${{ steps.versions.outputs.version }}
          path: versions/*/*/build/libs/tukuai-*-${{ steps.versions.outputs.version }}.jar
          if-no-files-found: error

      - name: Start Fabric 26.1.2 server
        run: .github/scripts/server-smoke.sh fabric 26.1.2

      - name: Start NeoForge 26.1.2 server
        run: .github/scripts/server-smoke.sh neoforge 26.1.2

      - name: Start Fabric 1.21.1 server
        run: .github/scripts/server-smoke.sh fabric 1.21.1

      - name: Start NeoForge 1.21.1 server
        run: .github/scripts/server-smoke.sh neoforge 1.21.1

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics
          path: |
            **/build/reports/tests/**
            versions/*/*/runs/server/logs/**
          if-no-files-found: ignore

  client:
    # Starts a real Fabric 26.1.2 client under a virtual display, plays a round at a card
    # table and prints the screenshots into the log as base64 so they can be read back. On
    # pull requests it also force-pushes them to the ci-screenshots branch, which is easier
    # to fetch than the log.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install a virtual display
        run: sudo apt-get update -q && sudo apt-get install -yq xvfb libgl1-mesa-dri mesa-utils

      - name: Run client game tests
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :fabric-26.1.2:runClientGameTest --no-daemon --stacktrace

      # The two-player test runs in the same run folder, which Loom clears first.
      - name: Keep the game test's screenshots
        if: always()
        run: |
          mkdir -p "${RUNNER_TEMP}/screenshots"
          find versions/26.1.2/fabric -path '*screenshots*' -name '*tukuai-*.png' -exec cp {} "${RUNNER_TEMP}/screenshots/" \;

      - name: Run the two-player game test
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :fabric-26.1.2:runMultiplayerTest --no-daemon --stacktrace

      - name: Keep the two-player test's screenshots
        if: always()
        run: |
          mkdir -p "${RUNNER_TEMP}/screenshots"
          find versions/26.1.2/fabric -path '*screenshots*' -name '*tukuai-*.png' -exec cp {} "${RUNNER_TEMP}/screenshots/" \;

      # Fabric's client game tests start with 1.21.4, so 1.21.1 plays through a world with
      # its own smoke test on each loader.
      - name: Run the Fabric 1.21.1 smoke test
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :fabric-1.21.1:runSmokeTest --no-daemon --stacktrace

      - name: Run the NeoForge 1.21.1 smoke test
        if: always()
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :neoforge-1.21.1:runSmokeTest --no-daemon --stacktrace

      - name: Keep the 1.21.1 smoke tests' screenshots
        if: always()
        run: |
          mkdir -p "${RUNNER_TEMP}/screenshots"
          for loader in fabric neoforge; do
            find "versions/1.21.1/${loader}/build/run/smoke/screenshots" -name 'tukuai-*.png' 2>/dev/null | while read -r f; do
              cp "$f" "${RUNNER_TEMP}/screenshots/1.21.1-${loader}-$(basename "$f")"
            done
          done

      - name: Start NeoForge 26.1.2 client
        run: xvfb-run -a -s "-screen 0 1280x720x24" .github/scripts/client-smoke.sh neoforge 26.1.2

      - name: Print screenshots
        if: always()
        run: |
          find "${RUNNER_TEMP}/screenshots" -name '*tukuai-*.png' | sort | while read -r f; do
            echo "BEGIN_SCREENSHOT $(basename "$f")"
            base64 -w 0 "$f"
            echo
            echo "END_SCREENSHOT"
          done

      - name: Publish screenshots
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          shots="${RUNNER_TEMP}/screenshots"
          [ -n "$(ls -A "${shots}" 2>/dev/null)" ] || exit 0
          cd "${shots}"
          git init -q -b ci-screenshots
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Screenshots of ${HEAD_SHA}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-screenshots

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: client-diagnostics
          path: |
            versions/*/fabric/build/run/**/logs/**
            versions/*/fabric/build/run/clientGameTest/peer-*/output.log
            versions/*/fabric/runs/**/logs/**
            versions/*/neoforge/runs/client/logs/**
            versions/*/neoforge/build/run/smoke/logs/**
          if-no-files-found: ignore
