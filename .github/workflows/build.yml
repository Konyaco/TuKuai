name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read versions
        id: versions
        run: echo "version=$(sed -n 's/^mod_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"

      - name: Check language files
        run: .github/scripts/check-lang.py

      # Gradle runs on the newest Java; the 1.21.11 and 1.21.1 projects build with Java 21 from a toolchain.
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: tukuai-${{ steps.versions.outputs.version }}
          path: |
            versions/*/*/build/libs/tukuai-*-${{ steps.versions.outputs.version }}.jar
            mc26/versions/*/build/libs/tukuai-*-${{ steps.versions.outputs.version }}.jar
          if-no-files-found: error

      - name: Start Fabric 26.3 server
        run: .github/scripts/server-smoke.sh fabric 26.3

      - name: Start NeoForge 26.3 server
        run: .github/scripts/server-smoke.sh neoforge 26.3

      - name: Start Fabric 26.2 server
        run: .github/scripts/server-smoke.sh fabric 26.2

      - name: Start NeoForge 26.2 server
        run: .github/scripts/server-smoke.sh neoforge 26.2

      - name: Start Fabric 26.1.2 server
        run: .github/scripts/server-smoke.sh fabric 26.1.2

      - name: Start NeoForge 26.1.2 server
        run: .github/scripts/server-smoke.sh neoforge 26.1.2

      - name: Start Fabric 1.21.11 server
        run: .github/scripts/server-smoke.sh fabric 1.21.11

      - name: Start NeoForge 1.21.11 server
        run: .github/scripts/server-smoke.sh neoforge 1.21.11

      - name: Start Fabric 1.21.1 server
        run: .github/scripts/server-smoke.sh fabric 1.21.1

      - name: Start NeoForge 1.21.1 server
        run: .github/scripts/server-smoke.sh neoforge 1.21.1

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics
          path: |
            **/build/reports/tests/**
            versions/*/*/runs/server/logs/**
            mc26/versions/*/runs/server/logs/**
          if-no-files-found: ignore

  client:
    # Starts real clients under a virtual display, one runner each so they run side by side:
    # Fabric 26.1.2's game tests play rounds at card tables, and every other version and
    # loader plays through a world with its smoke test (1.21.1 has its own, the 26.x nodes
    # share one). Each keeps its screenshots for the screenshots job below.
    name: client (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fabric 26.1.2 game tests
            id: fabric-26.1.2-game
            run: ./gradlew :mc26:fabric-26.1.2:runClientGameTest --no-daemon --stacktrace
            shots: mc26/versions/fabric-26.1.2
            prefix: ''
          - name: Fabric 26.1.2 two players
            id: fabric-26.1.2-multiplayer
            run: ./gradlew :mc26:fabric-26.1.2:runMultiplayerTest --no-daemon --stacktrace
            shots: mc26/versions/fabric-26.1.2
            prefix: ''
          - name: Fabric 26.3
            id: fabric-26.3
            run: ./gradlew :mc26:fabric-26.3:runSmokeTest --no-daemon --stacktrace
            shots: mc26/versions/fabric-26.3/build/run/smoke
            prefix: 26.3-fabric-
          - name: NeoForge 26.3
            id: neoforge-26.3
            run: ./gradlew :mc26:neoforge-26.3:runSmokeTest --no-daemon --stacktrace
            shots: mc26/versions/neoforge-26.3/build/run/smoke
            prefix: 26.3-neoforge-
          - name: Fabric 26.2
            id: fabric-26.2
            run: ./gradlew :mc26:fabric-26.2:runSmokeTest --no-daemon --stacktrace
            shots: mc26/versions/fabric-26.2/build/run/smoke
            prefix: 26.2-fabric-
          - name: NeoForge 26.2
            id: neoforge-26.2
            run: ./gradlew :mc26:neoforge-26.2:runSmokeTest --no-daemon --stacktrace
            shots: mc26/versions/neoforge-26.2/build/run/smoke
            prefix: 26.2-neoforge-
          - name: NeoForge 26.1.2
            id: neoforge-26.1.2
            run: ./gradlew :mc26:neoforge-26.1.2:runSmokeTest --no-daemon --stacktrace
            shots: mc26/versions/neoforge-26.1.2/build/run/smoke
            prefix: 26.1.2-neoforge-
          - name: Fabric 1.21.11
            id: fabric-1.21.11
            run: ./gradlew :mc26:fabric-1.21.11:runSmokeTest --no-daemon --stacktrace
            shots: mc26/versions/fabric-1.21.11/build/run/smoke
            prefix: 1.21.11-fabric-
          - name: NeoForge 1.21.11
            id: neoforge-1.21.11
            run: ./gradlew :mc26:neoforge-1.21.11:runSmokeTest --no-daemon --stacktrace
            shots: mc26/versions/neoforge-1.21.11/build/run/smoke
            prefix: 1.21.11-neoforge-
          - name: Fabric 1.21.1
            id: fabric-1.21.1
            run: ./gradlew :fabric-1.21.1:runSmokeTest --no-daemon --stacktrace
            shots: versions/1.21.1/fabric/build/run/smoke
            prefix: 1.21.1-fabric-
          - name: NeoForge 1.21.1
            id: neoforge-1.21.1
            run: ./gradlew :neoforge-1.21.1:runSmokeTest --no-daemon --stacktrace
            shots: versions/1.21.1/neoforge/build/run/smoke
            prefix: 1.21.1-neoforge-
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # 26.3 draws through SDL, which finds no OpenGL visual on Xvfb and falls back to Vulkan,
      # so it needs Mesa's software Vulkan too.
      - name: Install a virtual display
        run: sudo apt-get update -q && sudo apt-get install -yq xvfb libgl1-mesa-dri mesa-utils mesa-vulkan-drivers

      - name: Run ${{ matrix.name }}
        run: xvfb-run -a -s "-screen 0 1280x720x24" ${{ matrix.run }}

      - name: Keep the screenshots
        if: always() && matrix.shots != ''
        env:
          SHOTS: ${{ matrix.shots }}
          PREFIX: ${{ matrix.prefix }}
        run: |
          mkdir -p "${RUNNER_TEMP}/screenshots"
          find "${SHOTS}" -path '*screenshots*' -name '*tukuai-*.png' 2>/dev/null | while read -r f; do
            cp "$f" "${RUNNER_TEMP}/screenshots/${PREFIX}$(basename "$f")"
          done

      - name: Upload the screenshots
        if: always() && matrix.shots != ''
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.id }}
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: client-diagnostics-${{ matrix.id }}
          path: |
            versions/*/*/build/run/**/logs/**
            mc26/versions/*/build/run/**/logs/**
            mc26/versions/fabric-26.1.2/build/run/clientGameTest/peer-*/output.log
          if-no-files-found: ignore

  screenshots:
    # Prints every client's screenshots into the log as base64 so they can be read back. On
    # pull requests it also force-pushes them to the ci-screenshots branch, which is easier
    # to fetch than the log.
    needs: client
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect the screenshots
        uses: actions/download-artifact@v8
        with:
          pattern: screenshots-*
          merge-multiple: true
          path: ${{ runner.temp }}/screenshots

      - name: Print screenshots
        run: |
          find "${RUNNER_TEMP}/screenshots" -name '*tukuai-*.png' | sort | while read -r f; do
            echo "BEGIN_SCREENSHOT $(basename "$f")"
            base64 -w 0 "$f"
            echo
            echo "END_SCREENSHOT"
          done

      - name: Publish screenshots
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          shots="${RUNNER_TEMP}/screenshots"
          [ -n "$(ls -A "${shots}" 2>/dev/null)" ] || exit 0
          cd "${shots}"
          git init -q -b ci-screenshots
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Screenshots of ${HEAD_SHA}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-screenshots
