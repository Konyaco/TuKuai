name: Build

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read versions
        id: versions
        run: |
          echo "java=$(sed -n 's/^java_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
          echo "minecraft=$(sed -n 's/^minecraft_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n 's/^mod_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.versions.outputs.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload Fabric jar
        uses: actions/upload-artifact@v4
        with:
          name: tukuai-fabric-${{ steps.versions.outputs.minecraft }}-${{ steps.versions.outputs.version }}
          path: fabric/build/libs/tukuai-fabric-${{ steps.versions.outputs.minecraft }}-${{ steps.versions.outputs.version }}.jar
          if-no-files-found: error

      - name: Upload NeoForge jar
        uses: actions/upload-artifact@v4
        with:
          name: tukuai-neoforge-${{ steps.versions.outputs.minecraft }}-${{ steps.versions.outputs.version }}
          path: neoforge/build/libs/tukuai-neoforge-${{ steps.versions.outputs.minecraft }}-${{ steps.versions.outputs.version }}.jar
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore
