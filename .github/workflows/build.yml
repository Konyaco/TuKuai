name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read versions
        id: versions
        run: |
          echo "java=$(sed -n 's/^java_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
          echo "minecraft=$(sed -n 's/^minecraft_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n 's/^mod_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"

      - name: Check language files
        run: .github/scripts/check-lang.py

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.versions.outputs.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload Fabric jar
        uses: actions/upload-artifact@v7
        with:
          name: tukuai-fabric-${{ steps.versions.outputs.minecraft }}-${{ steps.versions.outputs.version }}
          path: fabric/build/libs/tukuai-fabric-${{ steps.versions.outputs.minecraft }}-${{ steps.versions.outputs.version }}.jar
          if-no-files-found: error

      - name: Upload NeoForge jar
        uses: actions/upload-artifact@v7
        with:
          name: tukuai-neoforge-${{ steps.versions.outputs.minecraft }}-${{ steps.versions.outputs.version }}
          path: neoforge/build/libs/tukuai-neoforge-${{ steps.versions.outputs.minecraft }}-${{ steps.versions.outputs.version }}.jar
          if-no-files-found: error

      - name: Start Fabric server
        run: .github/scripts/server-smoke.sh fabric

      - name: Start NeoForge server
        run: .github/scripts/server-smoke.sh neoforge

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics
          path: |
            **/build/reports/tests/**
            */runs/server/logs/**
          if-no-files-found: ignore

  client:
    # Starts a real Fabric client under a virtual display, plays a round at a card table
    # and prints the screenshots into the log as base64 so they can be read back. On pull
    # requests it also force-pushes them to the ci-screenshots branch, which is easier to
    # fetch than the log.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install a virtual display
        run: sudo apt-get update -q && sudo apt-get install -yq xvfb libgl1-mesa-dri mesa-utils

      - name: Run client game tests
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :fabric:runClientGameTest --no-daemon --stacktrace

      - name: Start NeoForge client
        run: xvfb-run -a -s "-screen 0 1280x720x24" .github/scripts/client-smoke.sh

      - name: Print screenshots
        if: always()
        run: |
          find fabric -path '*screenshots*' -name '*tukuai-*.png' | sort | while read -r f; do
            echo "BEGIN_SCREENSHOT $(basename "$f")"
            base64 -w 0 "$f"
            echo
            echo "END_SCREENSHOT"
          done

      - name: Publish screenshots
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          shots="${RUNNER_TEMP}/screenshots"
          mkdir -p "${shots}"
          find fabric -path '*screenshots*' -name '*tukuai-*.png' -exec cp {} "${shots}/" \;
          [ -n "$(ls -A "${shots}")" ] || exit 0
          cd "${shots}"
          git init -q -b ci-screenshots
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Screenshots of ${HEAD_SHA}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-screenshots

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: client-diagnostics
          path: |
            fabric/build/run/**/logs/**
            fabric/run/**/logs/**
            neoforge/runs/client/logs/**
          if-no-files-found: ignore
