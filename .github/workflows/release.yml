name: Release

# Builds every loader for every Minecraft version and publishes a GitHub release with the
# jars, either when a tag such as v0.1.0 is pushed or when the workflow is started by hand on
# a branch (it then tags that commit itself). The tag is always v<mod_version> from
# gradle.properties, and the release text comes from .github/release-notes/<tag>.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read versions
        id: versions
        run: |
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "v${version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match mod_version ${version}" >&2
            exit 1
          fi
          minecraft="$(ls versions | sort -t. -k1,1nr -k2,2nr -k3,3nr | paste -sd/ - | sed 's|/| / |g')"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "minecraft=${minecraft}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Gradle runs on the newest Java; older Minecraft versions build with their own from a toolchain.
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          MC: ${{ steps.versions.outputs.minecraft }}
          VERSION: ${{ steps.versions.outputs.version }}
          TAG: ${{ steps.versions.outputs.tag }}
        run: |
          gh release create "${TAG}" --target "${GITHUB_SHA}" \
            versions/*/*/build/libs/tukuai-*-"${VERSION}".jar \
            --title "土块棋牌室 TuKuai ${VERSION} (Minecraft ${MC})" \
            --notes-file ".github/release-notes/${TAG}.md"
