name: Release

# Pushing a tag such as v0.1.0 builds both loaders and publishes a GitHub release with
# the two jars. The tag must match mod_version in gradle.properties, and the release
# text comes from .github/release-notes/<tag>.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read versions
        id: versions
        run: |
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [[ "v${version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match mod_version ${version}" >&2
            exit 1
          fi
          echo "java=$(sed -n 's/^java_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
          echo "minecraft=$(sed -n 's/^minecraft_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.versions.outputs.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          MC: ${{ steps.versions.outputs.minecraft }}
          VERSION: ${{ steps.versions.outputs.version }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "fabric/build/libs/tukuai-fabric-${MC}-${VERSION}.jar" \
            "neoforge/build/libs/tukuai-neoforge-${MC}-${VERSION}.jar" \
            --title "土块棋牌室 TuKuai ${VERSION} (Minecraft ${MC})" \
            --notes-file ".github/release-notes/${GITHUB_REF_NAME}.md"
