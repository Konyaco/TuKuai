org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
# The loaders get the Kotlin runtime from Kotlin for Forge and Fabric Language Kotlin, so
# nothing should add or bundle a second copy.
kotlin.stdlib.default.dependency=false

# Mod
mod_id=tukuai
mod_name=TuKuai
mod_version=0.7.0
mod_author=Konyaco
maven_group=io.github.konyaco.tukuai
license=MIT

# Toolchain. Each Minecraft version under versions/ has its own gradle.properties with the
# game, Java and loader versions for it.
# Keep Kotlin at or below the version bundled by every runtime library: Kotlin for Forge
# 6.4.0 and 5.12.0 ship 2.4.0, Fabric Language Kotlin 1.13.13 ships 2.4.10.
kotlin_version=2.4.0
loom_version=1.18.1
moddev_version=2.0.147
fabric_loader_version=0.19.5
fabric_language_kotlin_version=1.13.13+kotlin.2.4.10

# Tests
junit_version=5.13.4
