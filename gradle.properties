org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# The loaders get the Kotlin runtime from Kotlin for Forge and Fabric Language
# Kotlin, so nothing should add or bundle a second copy.
kotlin.stdlib.default.dependency=false

# Mod
mod_id=tukuai
mod_name=TuKuai
mod_version=0.3.0
mod_author=Konyaco
maven_group=io.github.konyaco.tukuai
license=MIT

# Minecraft and toolchain
minecraft_version=26.1.2
java_version=25
# Keep this at or below the Kotlin version bundled by both runtime libraries:
# Kotlin for Forge 6.4.0 ships 2.4.0, Fabric Language Kotlin 1.13.13 ships 2.4.10.
kotlin_version=2.4.0

# Fabric, see https://fabricmc.net/develop/
loom_version=1.18.1
fabric_loader_version=0.19.5
fabric_api_version=0.155.3+26.1.2
fabric_language_kotlin_version=1.13.13+kotlin.2.4.10

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge
moddev_version=2.0.147
neoforge_version=26.1.2.109
kotlin_for_forge_version=6.4.0

# Tests
junit_version=5.13.4
