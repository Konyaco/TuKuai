# Minecraft 26.3, read by gradle/loader.gradle for the Fabric and NeoForge projects here.
minecraft_version=26.3
java_version=25

# Fabric, see https://fabricmc.net/develop/
fabric_api_version=0.165.0+26.3
# The Minecraft versions the Fabric jar loads on: 26.3 and its patch releases.
fabric_minecraft_range=~26.3

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.3.0.101
kotlin_for_forge_version=6.4.0
# The mod list's logo and description, renamed in NeoForge 26.2.
neoforge_logo_key=bannerFile
neoforge_description_key=neoforge.screen.mods.info.description

# Items, models and recipes are the same as 26.1.2's, so they come from there.
resources_from=26.1.2
