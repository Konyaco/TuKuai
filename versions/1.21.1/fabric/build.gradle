plugins {
    // Minecraft 1.21.1 is obfuscated, so Loom maps it to Mojang's names and remaps the jar.
    id 'net.fabricmc.fabric-loom-remap'
    id 'org.jetbrains.kotlin.jvm'
}

apply from: rootProject.file('gradle/loader.gradle')

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modImplementation "net.fabricmc:fabric-language-kotlin:${fabric_language_kotlin_version}"
}

// Fabric's client game tests start with Minecraft 1.21.4, so 1.21.1 has its own smoke test:
// a second mod that plays through a world by itself and takes screenshots, see SmokeTest.
// ./gradlew :fabric-1.21.1:runSmokeTest
sourceSets {
    smoke {
        kotlin.srcDir file('../src/smoke/kotlin')
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

loom {
    mods {
        tukuai { sourceSet sourceSets.main }
        'tukuai-smoke' { sourceSet sourceSets.smoke }
    }
    runs {
        client { runDir 'runs/client' }
        server { runDir 'runs/server' }
        smokeTest {
            client()
            name 'Smoke test'
            source sourceSets.smoke
            runDir 'build/run/smoke'
        }
    }
}

apply from: file('../smoke.gradle')
