// Shared setup for every loader project, applied after their plugins. A loader project
// lives in versions/<minecraft>/<loader>; the Minecraft, Java and loader versions come from
// versions/<minecraft>/gradle.properties. Each one compiles the engine, the common sources
// and its Minecraft version's own sources itself, so a release is one jar per loader and
// version, and the engine never needs its own jar-in-jar packaging.
def versionDir = projectDir.parentFile
def versionProperties = new Properties()
new File(versionDir, 'gradle.properties').withInputStream { versionProperties.load(it) }
versionProperties.each { key, value -> ext.set(key, value) }
// NeoForge 26.2 renamed the mod list's logo and description keys; older versions keep these.
ext.neoforge_logo_key = versionProperties.getProperty('neoforge_logo_key', 'logoFile')
ext.neoforge_description_key = versionProperties.getProperty('neoforge_description_key', 'fml.menu.mods.info.description')
ext.loader = projectDir.name

base {
    archivesName = "${mod_id}-${loader}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version.toInteger())
    withSourcesJar()
}

// Script plugins cannot see Kotlin plugin classes, so the JVM target follows the toolchain.
kotlin {
    jvmToolchain(java_version.toInteger())
}

// The common sources are written against the newest Minecraft; versions/<minecraft>/src has
// what differs for this version, mostly in the compat package.
sourceSets.main {
    kotlin.srcDir rootProject.file('engine/src/main/kotlin')
    kotlin.srcDir rootProject.file('common/src/main/kotlin')
    kotlin.srcDir new File(versionDir, 'src/main/kotlin')
    resources.srcDir rootProject.file('common/src/main/resources')
    resources.srcDir new File(versionDir, 'src/main/resources')
    // A version whose data files are the same as another's names it as resources_from.
    if (project.hasProperty('resources_from')) {
        resources.srcDir new File(versionDir.parentFile, "${resources_from}/src/main/resources")
    }
    // fabric.mod.json or neoforge.mods.toml, the same for every Minecraft version.
    resources.srcDir rootProject.file("common/src/${loader}/resources")
}

dependencies {
    // Provided at runtime by Kotlin for Forge or Fabric Language Kotlin.
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:${kotlin_version}"
}

processResources {
    def properties = [
        version                       : project.version,
        mod_id                        : mod_id,
        mod_name                      : mod_name,
        mod_author                    : mod_author,
        license                       : license,
        minecraft_version             : minecraft_version,
        fabric_minecraft_range        : fabric_minecraft_range,
        java_version                  : java_version,
        fabric_loader_version         : fabric_loader_version,
        fabric_language_kotlin_version: fabric_language_kotlin_version,
        neoforge_version              : neoforge_version,
        kotlin_for_forge_version      : kotlin_for_forge_version,
        neoforge_logo_key             : neoforge_logo_key,
    ]
    inputs.properties properties
    inputs.property 'neoforge_description_key', neoforge_description_key
    filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml']) { expand properties }
    // The language files name the mod list's description by the 26.1 key, which newer
    // NeoForge warns about on every start.
    if (neoforge_description_key != 'fml.menu.mods.info.description') {
        filesMatching('assets/*/lang/*.json') {
            filter { it.replace('"fml.menu.mods.info.description.', "\"${neoforge_description_key}.") }
        }
    }
}
